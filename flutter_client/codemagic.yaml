# Dùng khi Codemagic "Project path" = flutter_client (không phải gốc repo).
# Nếu Project path = . (gốc repo) → dùng /codemagic.yaml ở thư mục gốc.

workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: codemagic

    cache:
      cache_paths:
        - ~/.pub-cache
        - ios/Pods

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_APP_ID: "6762365741"
        BUNDLE_ID: "vn.sana.sbox"
        API_BASE_URL: "https://sbox.sana.vn"

    scripts:
      - name: Disable Shorebird (plain Flutter IPA only)
        script: |
          unset SHOREBIRD_TOKEN || true
          rm -rf "$HOME/.shorebird" 2>/dev/null || true

      - name: Fetch signing files and set up code signing
        script: |
          set -e
          echo "=== Preflight: App Store Connect API ==="
          if ! app-store-connect apps list --limit 1 >/dev/null 2>&1; then
            echo ""
            echo "ERROR: App Store Connect API failed (often HTTP 403 — agreement missing/expired)."
            echo "Fix: App Store Connect → Agreements, Tax, and Banking → accept pending agreement."
            exit 1
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --platform IOS --create
          keychain initialize
          app-store-connect certificates list --type IOS_DISTRIBUTION --save
          keychain add-certificates
          xcode-project use-profiles

      - name: Get Flutter packages
        script: flutter pub get

      - name: Convert ArcFace ONNX to CoreML (face on iOS)
        script: |
          if [ -f assets/w600k_mbf.onnx ]; then
            python3 -m pip install --quiet --upgrade coremltools onnx
            python3 ios/scripts/convert_facenet_to_coreml.py
          fi

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install --repo-update

      - name: Build IPA
        script: |
          set -e
          rm -rf "$HOME/.shorebird" 2>/dev/null || true
          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -1 | tr -d ' ')
          APP_VERSION_NAME=$(echo "$VERSION_LINE" | cut -d':' -f2 | cut -d'+' -f1)
          if [ -z "$APP_VERSION_NAME" ] || [ "$APP_VERSION_NAME" = "1.0.0" ]; then
            echo "ERROR: Invalid marketing version '$APP_VERSION_NAME' (must be > 1.0.0). Check pubspec.yaml."
            exit 1
          fi
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" || echo 0) + 1))
          echo "CFBundleShortVersionString=$APP_VERSION_NAME CFBundleVersion=$BUILD_NUMBER"
          flutter build ipa --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --build-name="$APP_VERSION_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
          ARCHIVE_PLIST=$(find build/ios/archive -path '*/Products/Applications/*.app/Info.plist' 2>/dev/null | head -1)
          if [ -n "$ARCHIVE_PLIST" ]; then
            echo "Verify archive CFBundleShortVersionString:"
            /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$ARCHIVE_PLIST"
          fi

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  ios-debug:
    name: iOS Debug (Ad Hoc)
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "vn.sana.sbox"
        API_BASE_URL: "https://sbox.sana.vn"
    scripts:
      - name: Disable Shorebird
        script: unset SHOREBIRD_TOKEN || true; rm -rf "$HOME/.shorebird" 2>/dev/null || true
      - name: Code signing
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_AD_HOC --platform IOS --create
          keychain initialize
          app-store-connect certificates list --type IOS_DISTRIBUTION --save
          keychain add-certificates
          xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: Pod install
        script: cd ios && pod install --repo-update
      - name: Build IPA
        script: |
          flutter build ipa --debug \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
