<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Bài viết — SBOX HRM</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <script src="config.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #18181b;
      line-height: 1.6;
    }
    .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 48px; }
    .brand {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 24px; color: #1e3a5f; font-weight: 700; font-size: 15px;
    }
    .card {
      background: #fff; border-radius: 16px;
      border: 1px solid #e4e4e7;
      box-shadow: 0 4px 24px rgba(0,0,0,.06);
      overflow: hidden;
    }
    .cover { width: 100%; max-height: 360px; object-fit: cover; display: block; }
    .body { padding: 28px 24px; }
    .badge {
      display: inline-block; font-size: 12px; font-weight: 600;
      padding: 4px 10px; border-radius: 8px;
      background: #e8f0fe; color: #1e3a5f; margin-bottom: 12px;
    }
    h1 { margin: 0 0 12px; font-size: 26px; line-height: 1.3; }
    .meta { font-size: 13px; color: #71717a; margin-bottom: 20px; }
    .summary {
      background: #eff6ff; border: 1px solid #bfdbfe;
      border-radius: 10px; padding: 12px 14px;
      font-style: italic; color: #1d4ed8; margin-bottom: 20px;
    }
    .content { font-size: 15px; }
    .content img { max-width: 100%; height: auto; border-radius: 8px; }
    .gallery { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; }
    .gallery img { width: 120px; height: 80px; object-fit: cover; border-radius: 8px; }
    .loading, .error { text-align: center; padding: 48px 16px; color: #71717a; }
    .error { color: #ef4444; }
    footer { text-align: center; margin-top: 32px; font-size: 12px; color: #a1a1aa; }
    footer a { color: #1e3a5f; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <span>SBOX HRM — Truyền thông</span>
    </div>
    <div id="app" class="loading">Đang tải bài viết…</div>
    <footer>
      <a href="/">Đăng nhập SBOX HRM</a> để xem thêm nội dung nội bộ
    </footer>
  </div>
  <script>
    function apiBase() {
      if (window.API_BASE_URL && window.API_BASE_URL !== '__API_BASE_URL__')
        return window.API_BASE_URL.replace(/\/$/, '');
      return window.location.origin;
    }
    function parseToken() {
      const path = window.location.pathname || '';
      const m = path.match(/\/share\/([^/]+)\/?$/i);
      if (m) return decodeURIComponent(m[1]);
      const q = new URLSearchParams(window.location.search).get('t');
      return q || '';
    }
    function absUrl(url) {
      if (!url) return '';
      if (url.startsWith('http')) return url;
      return apiBase() + (url.startsWith('/') ? url : '/' + url);
    }
    function typeLabel(t) {
      const map = {0:'Tin tức',1:'Thông báo',2:'Sự kiện',3:'Chính sách',4:'Đào tạo',5:'Văn hóa',6:'Tuyển dụng',7:'Nội quy'};
      return map[t] || 'Bài viết';
    }
    function fmtDate(d) {
      if (!d) return '';
      try {
        return new Date(d).toLocaleString('vi-VN', { dateStyle: 'medium', timeStyle: 'short' });
      } catch (_) { return d; }
    }
    async function load() {
      const token = parseToken();
      const el = document.getElementById('app');
      if (!token) {
        el.className = 'error card body';
        el.textContent = 'Link không hợp lệ.';
        return;
      }
      try {
        const res = await fetch(apiBase() + '/api/communications/public/' + encodeURIComponent(token) + '?countView=true');
        const json = await res.json();
        if (!json.isSuccess || !json.data) {
          el.className = 'error card body';
          el.textContent = json.message || 'Không tìm thấy bài viết hoặc link đã hết hạn.';
          return;
        }
        const d = json.data;
        document.title = (d.title || 'Bài viết') + ' — SBOX HRM';
        let html = '<article class="card">';
        if (d.thumbnailUrl) html += '<img class="cover" src="' + absUrl(d.thumbnailUrl) + '" alt="" />';
        html += '<div class="body">';
        html += '<span class="badge">' + typeLabel(d.type) + '</span>';
        html += '<h1>' + escapeHtml(d.title || '') + '</h1>';
        html += '<div class="meta">';
        if (d.authorName) html += escapeHtml(d.authorName) + ' · ';
        if (d.storeName) html += escapeHtml(d.storeName) + ' · ';
        if (d.publishedAt) html += fmtDate(d.publishedAt);
        html += '</div>';
        if (d.summary) html += '<div class="summary">' + escapeHtml(d.summary) + '</div>';
        html += '<div class="content">' + (d.content || '') + '</div>';
        if (d.attachedImages && d.attachedImages.length) {
          html += '<div class="gallery">';
          d.attachedImages.forEach(function(u) {
            html += '<img src="' + absUrl(u) + '" alt="" />';
          });
          html += '</div>';
        }
        html += '</div></article>';
        el.innerHTML = html;
        el.className = '';
      } catch (e) {
        el.className = 'error card body';
        el.textContent = 'Không thể tải bài viết. Vui lòng thử lại sau.';
      }
    }
    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    load();
  </script>
</body>
</html>
