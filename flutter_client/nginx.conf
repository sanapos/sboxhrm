server {

    listen 80;

    server_name _;

    root /usr/share/nginx/html;

    index index.html;



    gzip on;

    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript application/wasm;

    gzip_min_length 256;



    add_header X-Content-Type-Options "nosniff" always;

    add_header X-Frame-Options "SAMEORIGIN" always;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;



    # Flutter app shell + JS entry (must always revalidate)

    location ~* ^/(index\.html|flutter_bootstrap\.js|flutter\.js|main\.dart\.js|main\.dart\.js_.*\.part\.js|flutter_service_worker\.js|config\.js|version\.json|manifest\.json)$ {

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;

        add_header Pragma "no-cache" always;

        add_header Expires "0" always;

        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;

        try_files $uri =404;

    }



    # Manifests change every build — do not cache long-term

    location ~* ^/assets/(AssetManifest|FontManifest|NOTICES) {

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;

        try_files $uri =404;

    }



    location ~* ^/canvaskit/ {

        expires 30d;

        add_header Cache-Control "public, immutable";

    }



    # Images/fonts (rarely change without filename hash)

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {

        expires 7d;

        add_header Cache-Control "public, max-age=604800";

    }



    # Other wasm/js under assets (short TTL — not immutable)

    location ~* \.(wasm|js)$ {

        expires 1h;

        add_header Cache-Control "public, max-age=3600";

    }



    location ~ ^/share/([^/]+)/?$ {

        try_files /share.html =404;

    }



    location / {

        add_header Cache-Control "no-cache, must-revalidate" always;

        try_files $uri $uri/ /index.html;

    }

}


