server {

    listen 80;

    server_name _;

    root /usr/share/nginx/html;

    # Trang chủ SEO = home.html; app Flutter = /index.html + SPA routes
    index home.html index.html;



    gzip on;

    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript application/wasm;

    gzip_min_length 256;



    add_header X-Content-Type-Options "nosniff" always;

    add_header X-Frame-Options "SAMEORIGIN" always;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;



    # Exact homepage — static marketing page for Google SEO
    location = / {
        try_files /home.html =404;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Legacy Flutter landing → trang chủ (giữ ?section=)
    location = /landing {
        return 301 https://$host/$is_args$args;
    }
    location = /landing/ {
        return 301 https://$host/$is_args$args;
    }

    location = /home.html {
        try_files /home.html =404;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header X-Robots-Tag "index, follow" always;
    }

    location = /privacy-policy.html {
        try_files /privacy-policy.html =404;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /sitemap.xml {
        try_files /sitemap.xml =404;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Content-Type "application/xml" always;
    }

    location = /robots.txt {
        try_files /robots.txt =404;
        add_header Cache-Control "public, max-age=3600" always;
    }



    # Flutter app shell + JS entry (must always revalidate)
    # noindex: tránh trùng nội dung với trang chủ SEO
    location ~* ^/(index\.html|flutter_bootstrap\.js|flutter\.js|main\.dart\.js|main\.dart\.js_.*\.part\.js|flutter_service_worker\.js|config\.js|version\.json|manifest\.json)$ {

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;

        add_header Pragma "no-cache" always;

        add_header Expires "0" always;

        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;

        add_header X-Robots-Tag "noindex, follow" always;

        try_files $uri =404;

    }



    # Manifests change every build — do not cache long-term

    location ~* ^/assets/(AssetManifest|FontManifest|NOTICES) {

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;

        try_files $uri =404;

    }



    location ~* ^/canvaskit/ {

        expires 30d;

        add_header Cache-Control "public, immutable";

    }



    # Images/fonts (rarely change without filename hash)

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {

        expires 7d;

        add_header Cache-Control "public, max-age=604800";

    }



    # Other wasm/js under assets (short TTL — not immutable)

    location ~* \.(wasm|js)$ {

        expires 1h;

        add_header Cache-Control "public, max-age=3600";

    }



    location ~ ^/share/([^/]+)/?$ {

        try_files /share.html =404;

    }



    # Flutter SPA routes (login, register, landing, app modules)
    location / {

        add_header Cache-Control "no-cache, must-revalidate" always;

        add_header X-Robots-Tag "noindex, follow" always;

        try_files $uri $uri/ /index.html;

    }

}
