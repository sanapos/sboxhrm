# Codemagic: chọn workflow "iOS Release" hoặc "iOS Debug" — KHÔNG dùng "Default Workflow" + Shorebird.
# Nếu bật Shorebird trên UI: xóa biến SHOREBIRD_TOKEN (đang sai định dạng) hoặc tắt Shorebird trong Workflow Editor.

workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 90
    instance_type: mac_mini_m2
    working_directory: flutter_client

    cache:
      cache_paths:
        - ~/.pub-cache
        - ios/Pods

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - appstore_credentials
      vars:
        APP_STORE_APP_ID: "6762365741"
        BUNDLE_ID: "vn.sana.sbox"
        API_BASE_URL: "https://sboxhrm.com"

    scripts:
      - name: Disable Shorebird (plain Flutter IPA only)
        script: |
          unset SHOREBIRD_TOKEN || true
          rm -rf "$HOME/.shorebird" 2>/dev/null || true
          hash -r 2>/dev/null || true
          echo "Shorebird disabled — using flutter build ipa"

      - name: Fetch signing files and set up code signing
        script: |
          set -e
          echo "=== Preflight: App Store Connect API ==="
          if [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_KEY_IDENTIFIER" ] || [ -z "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "ERROR: Missing APP_STORE_CONNECT_* env vars (group appstore_credentials)."
            exit 1
          fi
          if ! app-store-connect bundle-ids list 2>&1 | head -5; then
            echo ""
            echo "ERROR: App Store Connect API failed."
            exit 1
          fi

          bash "$CM_BUILD_DIR/scripts/ios_signing.sh" IOS_APP_STORE
          echo "=== Code signing OK ==="

      - name: Get Flutter packages
        script: flutter pub get

      - name: Convert ArcFace ONNX to CoreML (face on iOS)
        script: |
          if [ -f assets/w600k_mbf.onnx ]; then
            python3 -m pip install --quiet --upgrade coremltools onnx
            python3 ios/scripts/convert_facenet_to_coreml.py
            ls -lh ios/Runner/FaceNet.mlpackage || true
          else
            echo "Skip CoreML convert: assets/w600k_mbf.onnx not in repo (use committed FaceNet.mlpackage)."
          fi

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update

      - name: Build IPA
        script: |
          set -e
          rm -f ~/.shorebird/bin/shorebird 2>/dev/null || true
          export PATH=$(echo "$PATH" | tr ':' '\n' | grep -v shorebird | tr '\n' ':')
          # Must run in same step: Codemagic does not persist export across script steps.
          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -1 | tr -d ' ')
          APP_VERSION_NAME=$(echo "$VERSION_LINE" | cut -d':' -f2 | cut -d'+' -f1)
          if [ -z "$APP_VERSION_NAME" ] || [ "$APP_VERSION_NAME" = "1.0.0" ]; then
            echo "ERROR: Invalid marketing version '$APP_VERSION_NAME' (must be > 1.0.0). Check pubspec.yaml."
            exit 1
          fi
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" || echo 0) + 1))
          echo "CFBundleShortVersionString=$APP_VERSION_NAME CFBundleVersion=$BUILD_NUMBER"
          flutter build ipa --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --build-name="$APP_VERSION_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
          ARCHIVE_PLIST=$(find build/ios/archive -path '*/Products/Applications/*.app/Info.plist' 2>/dev/null | head -1)
          if [ -n "$ARCHIVE_PLIST" ]; then
            echo "Verify archive CFBundleShortVersionString:"
            /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$ARCHIVE_PLIST"
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        # Dừng ở TestFlight. Bật submit_to_app_store nghĩa là mỗi lần build là
        # tự vào hàng đợi duyệt, kèm huỷ bản đang chờ — dùng workflow
        # ios-app-store-submit khi thật sự muốn phát hành.
        submit_to_app_store: false

  ios-pos-release:
    name: iOS POS Release (sboxpos.com)
    max_build_duration: 90
    instance_type: mac_mini_m2
    working_directory: flutter_client

    cache:
      cache_paths:
        - ~/.pub-cache
        - ios/Pods

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - appstore_credentials
      vars:
        APP_STORE_APP_ID: "6807833339"
        BUNDLE_ID: "com.sboxpos"
        API_BASE_URL: "https://sboxpos.com"
        APP_DISPLAY_NAME: "SBOX POS"
        POS_APP_VERSION: "1.0.5"
        APP_REVIEW_USERNAME: "demopos@gmail.com"
        APP_REVIEW_PASSWORD: "123456"
        SBOX_POS_IOS: "1"

    scripts:
      - name: Disable Shorebird (plain Flutter IPA only)
        script: |
          unset SHOREBIRD_TOKEN || true
          rm -rf "$HOME/.shorebird" 2>/dev/null || true
          hash -r 2>/dev/null || true
          echo "Shorebird disabled — using flutter build ipa"

      - name: Point iOS project at SBOX POS bundle
        script: |
          set -e
          python3 <<'PY'
          import os
          from pathlib import Path
          bundle = os.environ["BUNDLE_ID"]
          p = Path("ios/Runner.xcodeproj/project.pbxproj")
          text = p.read_text()
          old = "PRODUCT_BUNDLE_IDENTIFIER = vn.sana.sbox;"
          new = f"PRODUCT_BUNDLE_IDENTIFIER = {bundle};"
          n = text.count(old)
          if n != 3:
              raise SystemExit(f"expected 3 Runner bundle ids, found {n}")
          p.write_text(text.replace(old, new))
          print(f"Replaced {n} PRODUCT_BUNDLE_IDENTIFIER -> {bundle}")
          PY
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $APP_DISPLAY_NAME" ios/Runner/Info.plist
          echo "CFBundleDisplayName=$APP_DISPLAY_NAME BUNDLE_ID=$BUNDLE_ID APP=$APP_STORE_APP_ID"
          # Info.plist dùng chung với HRM: câu xin quyền của POS phải đúng với POS (Apple từ chối 2.3.1(a) ngày 01/10/2026).
          set_usage() { /usr/libexec/PlistBuddy -c "Set :$1 $2" ios/Runner/Info.plist; }
          set_usage NSCameraUsageDescription "Camera dùng để quét mã vạch sản phẩm, chụp ảnh hàng hóa và chụp hóa đơn hoặc thực đơn gửi cho Trợ lý AI, chỉ khi bạn chủ động dùng. Ứng dụng không quay video nền."
          /usr/libexec/PlistBuddy -c "Delete :NSLocationWhenInUseUsageDescription" ios/Runner/Info.plist
          set_usage NSLocalNetworkUsageDescription "Mạng nội bộ dùng để tìm và kết nối máy in hóa đơn, màn hình bếp trong cùng WiFi cửa hàng."
          set_usage NSBluetoothAlwaysUsageDescription "Bluetooth dùng để kết nối máy in hóa đơn và máy in tem."
          set_usage NSBluetoothPeripheralUsageDescription "Bluetooth dùng để kết nối máy in hóa đơn và máy in tem."
          set_usage NSFaceIDUsageDescription "Face ID dùng để đăng nhập nhanh vào SBOX POS thay cho mật khẩu, chỉ khi bạn bật trong Cài đặt."
          # Icon xanh lá của POS thay cho icon HRM (nguồn: scripts/make-flavor-icons.py).
          ICON_DIR=ios/Runner/Assets.xcassets/AppIcon.appiconset
          for f in "$ICON_DIR"/*.png; do
            px=$(sips -g pixelWidth "$f" | awk '/pixelWidth/{print $2}')
            sips -s format png -z "$px" "$px" ios/flavor_icons/pos-1024.png --out "$f" >/dev/null
          done
          echo "POS usage strings and app icon applied"

      - name: Remove face and location from SBOX POS
        script: python3 "$CM_BUILD_DIR/scripts/prepare_ios_pos_build.py" "$CM_BUILD_DIR/flutter_client"

      - name: Fetch signing files and set up code signing
        script: |
          set -e
          echo "=== Preflight: App Store Connect API ==="
          if [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_KEY_IDENTIFIER" ] || [ -z "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "ERROR: Missing APP_STORE_CONNECT_* env vars (group appstore_credentials)."
            exit 1
          fi
          if ! app-store-connect bundle-ids list 2>&1 | head -5; then
            echo ""
            echo "ERROR: App Store Connect API failed."
            exit 1
          fi

          bash "$CM_BUILD_DIR/scripts/ios_signing.sh" IOS_APP_STORE
          echo "=== Code signing OK ==="

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update

      - name: Build POS IPA
        script: |
          set -e
          rm -f ~/.shorebird/bin/shorebird 2>/dev/null || true
          export PATH=$(echo "$PATH" | tr ':' '\n' | grep -v shorebird | tr '\n' ':')
          APP_VERSION_NAME="${POS_APP_VERSION:-1.0.5}"
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" || echo 0) + 1))
          echo "POS IPA API_BASE_URL=$API_BASE_URL SBOX_POS_STANDALONE=true BUNDLE_ID=$BUNDLE_ID"
          echo "CFBundleShortVersionString=$APP_VERSION_NAME CFBundleVersion=$BUILD_NUMBER CFBundleDisplayName=$APP_DISPLAY_NAME"
          flutter build ipa --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=SBOX_POS_STANDALONE=true \
            --build-name="$APP_VERSION_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
          ARCHIVE_PLIST=$(find build/ios/archive -path '*/Products/Applications/*.app/Info.plist' 2>/dev/null | head -1)
          if [ -n "$ARCHIVE_PLIST" ]; then
            echo "Verify archive:"
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$ARCHIVE_PLIST"
            /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$ARCHIVE_PLIST"
            /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$ARCHIVE_PLIST"
          fi

      - name: Verify IPA has no face or location code
        script: python3 "$CM_BUILD_DIR/scripts/verify_ios_pos_ipa.py" build/ios/ipa/*.ipa

      - name: Set App Review demo account for sboxpos.com
        script: |
          set -e
          python3 "$CM_BUILD_DIR/scripts/asc_pos_review_account.py"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        # Dừng ở TestFlight. Chỉ nộp Apple sau khi đã kiểm tra build và mô tả App Store.
        submit_to_app_store: false

  ios-pos-store-submit:
    name: iOS POS Submit App Store Review
    max_build_duration: 30
    instance_type: mac_mini_m2
    working_directory: flutter_client

    environment:
      groups:
        - appstore_credentials
      vars:
        APP_STORE_APP_ID: "6807833339"
        APP_VERSION: "1.0.5"
        APP_REVIEW_USERNAME: "demopos@gmail.com"
        APP_REVIEW_PASSWORD: "123456"

    scripts:
      - name: Submit processed SBOX POS 1.0.5 build to App Store review
        script: |
          set -e
          if [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_KEY_IDENTIFIER" ] || [ -z "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "ERROR: Missing APP_STORE_CONNECT_* env vars (group appstore_credentials)."
            exit 1
          fi
          echo "Looking for a VALID build of SBOX POS $APP_VERSION"
          BUILDS_JSON=$(app-store-connect builds list \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "@env:APP_STORE_CONNECT_PRIVATE_KEY" \
            --app-id "$APP_STORE_APP_ID" \
            --pre-release-version "$APP_VERSION" \
            --processing-state VALID \
            --not-expired \
            --platform IOS \
            --json)
          BUILD_ID=$(BUILDS_JSON="$BUILDS_JSON" python3 - <<'PY'
          import json, os, sys
          raw = os.environ.get("BUILDS_JSON") or ""
          try:
              data = json.loads(raw) if raw.strip() else []
          except json.JSONDecodeError:
              sys.exit(0)
          items = data if isinstance(data, list) else data.get("data") or data.get("builds") or []
          if not items:
              sys.exit(0)

          def build_version(item):
              attrs = item.get("attributes") or {}
              try:
                  return int(attrs.get("version") or 0)
              except (TypeError, ValueError):
                  return 0

          items = sorted(items, key=build_version, reverse=True)
          build_id = items[0].get("id") or items[0].get("Id")
          version = build_version(items[0])
          if build_id:
              print(f"{build_id} {version}")
          PY
          )
          if [ -z "$BUILD_ID" ]; then
            echo "ERROR: No VALID build for $APP_VERSION"
            exit 1
          fi
          echo "Submitting $BUILD_ID ($APP_VERSION) and cancelling the previous submission"
          app-store-connect builds submit-to-app-store "${BUILD_ID%% *}" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "@env:APP_STORE_CONNECT_PRIVATE_KEY" \
            --version-string "$APP_VERSION" \
            --locale vi \
            --whats-new "Sửa bước xin quyền camera và vị trí: chỉ còn nút Tiếp tục, rồi luôn mở hộp thoại quyền của iOS." \
            --cancel-previous-submissions \
            --release-type AFTER_APPROVAL
          python3 "$CM_BUILD_DIR/scripts/asc_pos_review_account.py"
          echo "=== Submitted SBOX POS $APP_VERSION to App Store review ==="

  ios-app-store-submit:
    name: iOS Submit App Store Review
    max_build_duration: 30
    instance_type: mac_mini_m2
    working_directory: flutter_client

    environment:
      groups:
        - appstore_credentials
      vars:
        APP_STORE_APP_ID: "6762365741"
        APP_VERSION: "1.0.508"

    scripts:
      - name: Submit processed TestFlight build to App Store review
        script: |
          set -e
          if [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_KEY_IDENTIFIER" ] || [ -z "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "ERROR: Missing APP_STORE_CONNECT_* env vars (group appstore_credentials)."
            exit 1
          fi
          export APP_STORE_CONNECT_MAX_BUILD_PROCESSING_WAIT=90
          echo "Waiting for a VALID TestFlight build of $APP_VERSION (cancel pending review, then submit)"
          BUILD_ID=""
          for i in $(seq 1 40); do
            BUILDS_JSON=$(app-store-connect builds list \
              --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
              --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
              --private-key "@env:APP_STORE_CONNECT_PRIVATE_KEY" \
              --app-id "$APP_STORE_APP_ID" \
              --pre-release-version "$APP_VERSION" \
              --processing-state VALID \
              --not-expired \
              --platform IOS \
              --json) || true
            BUILD_ID=$(BUILDS_JSON="$BUILDS_JSON" APP_VERSION="$APP_VERSION" python3 - <<'PY'
          import json, os, sys
          raw = os.environ.get("BUILDS_JSON") or ""
          version = os.environ["APP_VERSION"]
          try:
              data = json.loads(raw) if raw.strip() else []
          except json.JSONDecodeError:
              sys.exit(0)
          items = data if isinstance(data, list) else data.get("data") or data.get("builds") or []
          if not items:
              sys.exit(0)

          def build_version(item):
              attrs = item.get("attributes") or {}
              try:
                  return int(attrs.get("version") or 0)
              except (TypeError, ValueError):
                  return 0

          items = sorted(items, key=build_version, reverse=True)
          build_id = items[0].get("id") or items[0].get("Id")
          if build_id:
              print(build_id)
          PY
            ) || true
            if [ -n "$BUILD_ID" ]; then
              echo "Found VALID build $BUILD_ID after ${i} attempt(s)"
              break
            fi
            echo "Attempt $i/40: $APP_VERSION still processing in TestFlight, wait 30s"
            sleep 30
          done
          if [ -z "$BUILD_ID" ]; then
            echo "ERROR: No VALID TestFlight build for $APP_VERSION after waiting"
            exit 1
          fi
          echo "Submitting build $BUILD_ID ($APP_VERSION) to App Store review (cancels previous submission)"
          app-store-connect builds submit-to-app-store "$BUILD_ID" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "@env:APP_STORE_CONNECT_PRIVATE_KEY" \
            --version-string "$APP_VERSION" \
            --locale vi \
            --whats-new "Cập nhật 1.0.508: sửa thông tin tài khoản và đổi mật khẩu; KPI gọn hơn trên iPhone; màn hình tự tải lại sau khi lưu; cải thiện ổn định trên iPhone và iPad." \
            --cancel-previous-submissions \
            --release-type AFTER_APPROVAL
          echo "=== Submitted $APP_VERSION to App Store review ==="

  # SBOX BOSS: không có khuôn mặt, vị trí, gỡ khỏi gói như POS. Dừng ở TestFlight nội bộ, không gửi Apple duyệt.
  ios-boss-release:
