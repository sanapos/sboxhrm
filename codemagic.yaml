# Codemagic: chọn workflow "iOS Release" hoặc "iOS Debug" — KHÔNG dùng "Default Workflow" + Shorebird.
# Nếu bật Shorebird trên UI: xóa biến SHOREBIRD_TOKEN (đang sai định dạng) hoặc tắt Shorebird trong Workflow Editor.

workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 90
    instance_type: mac_mini_m2
    working_directory: flutter_client

    cache:
      cache_paths:
        - ~/.pub-cache
        - ios/Pods

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - appstore_credentials
      vars:
        APP_STORE_APP_ID: "6762365741"
        BUNDLE_ID: "vn.sana.sbox"
        API_BASE_URL: "https://sbox.sana.vn"

    scripts:
      - name: Disable Shorebird (plain Flutter IPA only)
        script: |
          unset SHOREBIRD_TOKEN || true
          rm -rf "$HOME/.shorebird" 2>/dev/null || true
          hash -r 2>/dev/null || true
          echo "Shorebird disabled — using flutter build ipa"

      - name: Fetch signing files and set up code signing
        script: |
          set -e
          echo "=== Preflight: App Store Connect API ==="
          if [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_KEY_IDENTIFIER" ] || [ -z "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "ERROR: Missing APP_STORE_CONNECT_* env vars (group appstore_credentials)."
            exit 1
          fi
          if ! app-store-connect bundle-ids list 2>&1 | head -5; then
            echo ""
            echo "ERROR: App Store Connect API failed."
            exit 1
          fi

          revoke_distribution_certs() {
            python3 <<'PY'
          import json, subprocess, sys

          def collect_ids(payload):
              if isinstance(payload, list):
                  items = payload
              elif isinstance(payload, dict):
                  items = (
                      payload.get("certificates")
                      or payload.get("data")
                      or []
                  )
              else:
                  items = []
              ids = []
              for item in items:
                  if not isinstance(item, dict):
                      continue
                  cid = item.get("id") or item.get("Id")
                  if cid:
                      ids.append(cid)
              return ids

          seen = set()
          for cert_type in ("DISTRIBUTION", "IOS_DISTRIBUTION"):
              proc = subprocess.run(
                  ["app-store-connect", "certificates", "list", "--type", cert_type, "--json"],
                  capture_output=True,
                  text=True,
              )
              if proc.returncode != 0:
                  print(f"WARN: cannot list {cert_type}: {proc.stderr.strip()}", file=sys.stderr)
                  continue
              try:
                  ids = collect_ids(json.loads(proc.stdout or "[]"))
              except json.JSONDecodeError:
                  print(f"WARN: invalid JSON for {cert_type}", file=sys.stderr)
                  continue
              for cid in ids:
                  if cid in seen:
                      continue
                  seen.add(cid)
                  print(f"Deleting certificate {cid} ({cert_type})")
                  del_proc = subprocess.run(
                      ["app-store-connect", "certificates", "delete", cid],
                      capture_output=True,
                      text=True,
                  )
                  if del_proc.returncode != 0:
                      print(del_proc.stderr.strip(), file=sys.stderr)
                      sys.exit(1)
          print(f"Revoked {len(seen)} distribution certificate(s)")
          PY
          }

          echo "=== Revoke stale Distribution certificates ==="
          revoke_distribution_certs
          sleep 5

          echo "=== Fetch signing files (App Store) ==="
          CERT_KEY=$(mktemp)
          openssl genrsa -out "$CERT_KEY" 2048
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --certificate-key "@file:$CERT_KEY" \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
          rm -f "$CERT_KEY"
          echo "=== Code signing OK ==="

      - name: Get Flutter packages
        script: flutter pub get

      - name: Convert ArcFace ONNX to CoreML (face on iOS)
        script: |
          if [ -f assets/w600k_mbf.onnx ]; then
            python3 -m pip install --quiet --upgrade coremltools onnx
            python3 ios/scripts/convert_facenet_to_coreml.py
            ls -lh ios/Runner/FaceNet.mlpackage || true
          else
            echo "Skip CoreML convert: assets/w600k_mbf.onnx not in repo (use committed FaceNet.mlpackage)."
          fi

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update

      - name: Build IPA
        script: |
          set -e
          rm -f ~/.shorebird/bin/shorebird 2>/dev/null || true
          export PATH=$(echo "$PATH" | tr ':' '\n' | grep -v shorebird | tr '\n' ':')
          # Must run in same step: Codemagic does not persist export across script steps.
          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -1 | tr -d ' ')
          APP_VERSION_NAME=$(echo "$VERSION_LINE" | cut -d':' -f2 | cut -d'+' -f1)
          if [ -z "$APP_VERSION_NAME" ] || [ "$APP_VERSION_NAME" = "1.0.0" ]; then
            echo "ERROR: Invalid marketing version '$APP_VERSION_NAME' (must be > 1.0.0). Check pubspec.yaml."
            exit 1
          fi
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" || echo 0) + 1))
          echo "CFBundleShortVersionString=$APP_VERSION_NAME CFBundleVersion=$BUILD_NUMBER"
          flutter build ipa --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --build-name="$APP_VERSION_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
          ARCHIVE_PLIST=$(find build/ios/archive -path '*/Products/Applications/*.app/Info.plist' 2>/dev/null | head -1)
          if [ -n "$ARCHIVE_PLIST" ]; then
            echo "Verify archive CFBundleShortVersionString:"
            /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$ARCHIVE_PLIST"
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: true
        cancel_previous_submissions: true
        release_type: MANUAL

  ios-app-store-submit:
    name: iOS Submit App Store Review
    max_build_duration: 30
    instance_type: mac_mini_m2
    working_directory: flutter_client

    environment:
      groups:
        - appstore_credentials
      vars:
        APP_STORE_APP_ID: "6762365741"
        APP_VERSION: "1.0.40"

    scripts:
      - name: Submit processed TestFlight build to App Store review
        script: |
          set -e
          if [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_KEY_IDENTIFIER" ] || [ -z "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "ERROR: Missing APP_STORE_CONNECT_* env vars (group appstore_credentials)."
            exit 1
          fi
          export APP_STORE_CONNECT_MAX_BUILD_PROCESSING_WAIT=90
          BUILDS_JSON=$(app-store-connect builds list \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "@env:APP_STORE_CONNECT_PRIVATE_KEY" \
            --app-id "$APP_STORE_APP_ID" \
            --pre-release-version "$APP_VERSION" \
            --processing-state VALID \
            --not-expired \
            --platform IOS \
            --json)
          BUILD_ID=$(BUILDS_JSON="$BUILDS_JSON" APP_VERSION="$APP_VERSION" python3 - <<'PY'
          import json, os, sys
          data = json.loads(os.environ["BUILDS_JSON"])
          version = os.environ["APP_VERSION"]
          items = data if isinstance(data, list) else data.get("data") or data.get("builds") or []
          if not items:
              sys.stderr.write(f"No VALID TestFlight builds found for version {version}\n")
              sys.exit(1)

          def build_version(item):
              attrs = item.get("attributes") or {}
              try:
                  return int(attrs.get("version") or 0)
              except (TypeError, ValueError):
                  return 0

          items = sorted(items, key=build_version, reverse=True)
          build_id = items[0].get("id") or items[0].get("Id")
          if not build_id:
              sys.stderr.write("Could not resolve build id from App Store Connect response\n")
              sys.exit(1)
          print(build_id)
          PY
          )
          echo "Submitting build $BUILD_ID ($APP_VERSION) to App Store review"
          app-store-connect builds submit-to-app-store "$BUILD_ID" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "@env:APP_STORE_CONNECT_PRIVATE_KEY" \
            --version-string "$APP_VERSION" \
            --locale vi \
            --whats-new "Cập nhật 1.0.39: sửa lỗi font Nghỉ phép, splash SBOX HRM, giao diện Công việc và điều hướng mobile." \
            --cancel-previous-submissions \
            --release-type MANUAL
          echo "=== Submitted $APP_VERSION to App Store review ==="

  ios-debug:
    name: iOS Debug (Ad Hoc)
    max_build_duration: 90
    instance_type: mac_mini_m2
    working_directory: flutter_client

    cache:
      cache_paths:
        - ~/.pub-cache
        - ios/Pods

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: "vn.sana.sbox"
        API_BASE_URL: "https://sbox.sana.vn"

    scripts:
      - name: Disable Shorebird (plain Flutter IPA only)
        script: |
          unset SHOREBIRD_TOKEN || true
          rm -rf "$HOME/.shorebird" 2>/dev/null || true

      - name: Fetch signing files and set up code signing
        script: |
          revoke_distribution_certs() {
            python3 <<'PY'
          import json, subprocess, sys

          def collect_ids(payload):
              if isinstance(payload, list):
                  items = payload
              elif isinstance(payload, dict):
                  items = payload.get("certificates") or payload.get("data") or []
              else:
                  items = []
              ids = []
              for item in items:
                  if not isinstance(item, dict):
                      continue
                  cid = item.get("id") or item.get("Id")
                  if cid:
                      ids.append(cid)
              return ids

          seen = set()
          for cert_type in ("DISTRIBUTION", "IOS_DISTRIBUTION"):
              proc = subprocess.run(
                  ["app-store-connect", "certificates", "list", "--type", cert_type, "--json"],
                  capture_output=True,
                  text=True,
              )
              if proc.returncode != 0:
                  continue
              try:
                  ids = collect_ids(json.loads(proc.stdout or "[]"))
              except json.JSONDecodeError:
                  continue
              for cid in ids:
                  if cid in seen:
                      continue
                  seen.add(cid)
                  print(f"Deleting certificate {cid} ({cert_type})")
                  del_proc = subprocess.run(
                      ["app-store-connect", "certificates", "delete", cid],
                      capture_output=True,
                      text=True,
                  )
                  if del_proc.returncode != 0:
                      print(del_proc.stderr.strip(), file=sys.stderr)
                      sys.exit(1)
          PY
          }

          revoke_distribution_certs
          sleep 5
          CERT_KEY=$(mktemp)
          openssl genrsa -out "$CERT_KEY" 2048
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_ADHOC \
            --platform IOS \
            --certificate-key "@file:$CERT_KEY" \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
          rm -f "$CERT_KEY"

      - name: Get Flutter packages
        script: flutter pub get

      - name: Convert ArcFace ONNX to CoreML (face on iOS)
        script: |
          if [ -f assets/w600k_mbf.onnx ]; then
            python3 -m pip install --quiet --upgrade coremltools onnx
            python3 ios/scripts/convert_facenet_to_coreml.py
          fi

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update

      - name: Build IPA
        script: |
          flutter build ipa --debug \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  android-release:
    name: Android Release (AAB)
    max_build_duration: 60
    instance_type: linux_x2
    working_directory: flutter_client

    environment:
      flutter: stable
      java: 17
      groups:
        - android_keystore
        - google_play
      vars:
        PACKAGE_NAME: "sbox.sana.vn"
        GOOGLE_PLAY_TRACK: internal
        API_BASE_URL: "https://sbox.sana.vn"

    scripts:
      - name: Set up Android keystore
        script: |
          set -e
          if [ -z "$CM_KEYSTORE" ]; then
            echo "ERROR: Missing CM_KEYSTORE (group android_keystore)."
            exit 1
          fi
          KEYSTORE_PATH="${CM_KEYSTORE_PATH:-android/app/sana-release.jks}"
          mkdir -p "$(dirname "$KEYSTORE_PATH")"
          echo "$CM_KEYSTORE" | base64 --decode > "$KEYSTORE_PATH"
          echo "Keystore written to $KEYSTORE_PATH"

      - name: Get Flutter packages
        script: flutter pub get

      - name: Build release AAB
        script: |
          set -e
          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -1 | tr -d ' ')
          APP_VERSION_NAME=$(echo "$VERSION_LINE" | cut -d':' -f2 | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$VERSION_LINE" | cut -d'+' -f2)
          if [ -z "$APP_VERSION_NAME" ] || [ -z "$BUILD_NUMBER" ]; then
            echo "ERROR: Invalid pubspec version line: $VERSION_LINE"
            exit 1
          fi
          echo "Building AAB version=$APP_VERSION_NAME build=$BUILD_NUMBER"
          flutter build appbundle --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --build-name="$APP_VERSION_NAME" \
            --build-number="$BUILD_NUMBER"
          AAB="build/app/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB" ]; then
            echo "ERROR: AAB not found at $AAB"
            exit 1
          fi
          OUT="build/app/outputs/bundle/release/SBOX-HRM-${PACKAGE_NAME}-release-v${BUILD_NUMBER}.aab"
          cp "$AAB" "$OUT"
          ls -lh build/app/outputs/bundle/release/*.aab

    artifacts:
      - build/app/outputs/bundle/release/*.aab

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: $GOOGLE_PLAY_TRACK
        submit_as_draft: false
