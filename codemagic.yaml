# Codemagic: chọn workflow "iOS Release" hoặc "iOS Debug" — KHÔNG dùng "Default Workflow" + Shorebird.
# Nếu bật Shorebird trên UI: xóa biến SHOREBIRD_TOKEN (đang sai định dạng) hoặc tắt Shorebird trong Workflow Editor.

workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 90
    instance_type: mac_mini_m2
    working_directory: flutter_client

    integrations:
      app_store_connect: codemagic

    cache:
      cache_paths:
        - ~/.pub-cache
        - ios/Pods

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_APP_ID: "6762365741"
        BUNDLE_ID: "vn.sana.sbox"
        API_BASE_URL: "https://sbox.sana.vn"

    scripts:
      - name: Disable Shorebird (plain Flutter IPA only)
        script: |
          unset SHOREBIRD_TOKEN || true
          rm -rf "$HOME/.shorebird" 2>/dev/null || true
          hash -r 2>/dev/null || true
          echo "Shorebird disabled — using flutter build ipa"

      - name: Fetch signing files and set up code signing
        script: |
          set -e
          echo "=== Preflight: App Store Connect API ==="
          if ! app-store-connect apps list --limit 1 >/dev/null 2>&1; then
            echo ""
            echo "ERROR: App Store Connect API từ chối (thường gặp HTTP 403)."
            echo "Nguyên nhân phổ biến: thỏa thuận Apple Developer chưa ký hoặc đã hết hạn."
            echo "Sửa: https://appstoreconnect.apple.com → Agreements, Tax, and Banking → chấp nhận thỏa thuận đang chờ."
            echo "Sau đó chạy lại build iOS Release."
            exit 1
          fi
          echo "=== Fetch signing files (App Store) ==="
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --create
          keychain initialize
          app-store-connect certificates list --type IOS_DISTRIBUTION --save
          keychain add-certificates
          xcode-project use-profiles
          echo "=== Code signing OK ==="

      - name: Get Flutter packages
        script: flutter pub get

      - name: Convert ArcFace ONNX to CoreML (face on iOS)
        script: |
          if [ -f assets/w600k_mbf.onnx ]; then
            python3 -m pip install --quiet --upgrade coremltools onnx
            python3 ios/scripts/convert_facenet_to_coreml.py
            ls -lh ios/Runner/FaceNet.mlpackage || true
          else
            echo "Skip CoreML convert: assets/w600k_mbf.onnx not in repo (use committed FaceNet.mlpackage)."
          fi

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update

      - name: Build IPA
        script: |
          set -e
          rm -f ~/.shorebird/bin/shorebird 2>/dev/null || true
          export PATH=$(echo "$PATH" | tr ':' '\n' | grep -v shorebird | tr '\n' ':')
          # Must run in same step: Codemagic does not persist export across script steps.
          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -1 | tr -d ' ')
          APP_VERSION_NAME=$(echo "$VERSION_LINE" | cut -d':' -f2 | cut -d'+' -f1)
          if [ -z "$APP_VERSION_NAME" ] || [ "$APP_VERSION_NAME" = "1.0.0" ]; then
            echo "ERROR: Invalid marketing version '$APP_VERSION_NAME' (must be > 1.0.0). Check pubspec.yaml."
            exit 1
          fi
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" || echo 0) + 1))
          echo "CFBundleShortVersionString=$APP_VERSION_NAME CFBundleVersion=$BUILD_NUMBER"
          flutter build ipa --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --build-name="$APP_VERSION_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
          ARCHIVE_PLIST=$(find build/ios/archive -path '*/Products/Applications/*.app/Info.plist' 2>/dev/null | head -1)
          if [ -n "$ARCHIVE_PLIST" ]; then
            echo "Verify archive CFBundleShortVersionString:"
            /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$ARCHIVE_PLIST"
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  ios-debug:
    name: iOS Debug (Ad Hoc)
    max_build_duration: 90
    instance_type: mac_mini_m2
    working_directory: flutter_client

    integrations:
      app_store_connect: codemagic

    cache:
      cache_paths:
        - ~/.pub-cache
        - ios/Pods

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "vn.sana.sbox"

    scripts:
      - name: Disable Shorebird (plain Flutter IPA only)
        script: |
          unset SHOREBIRD_TOKEN || true
          rm -rf "$HOME/.shorebird" 2>/dev/null || true

      - name: Fetch signing files and set up code signing
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_AD_HOC \
            --platform IOS \
            --create
          keychain initialize
          app-store-connect certificates list \
            --type IOS_DISTRIBUTION \
            --save
          keychain add-certificates
          xcode-project use-profiles

      - name: Get Flutter packages
        script: flutter pub get

      - name: Convert ArcFace ONNX to CoreML (face on iOS)
        script: |
          if [ -f assets/w600k_mbf.onnx ]; then
            python3 -m pip install --quiet --upgrade coremltools onnx
            python3 ios/scripts/convert_facenet_to_coreml.py
          fi

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update

      - name: Build IPA
        script: |
          flutter build ipa --debug \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  android-release:
    name: Android Release (APK)
    max_build_duration: 60
    instance_type: linux_x2
    working_directory: flutter_client

    environment:
      flutter: stable
      java: 17
      vars:
        PACKAGE_NAME: "vn.sana.sbox"
      # To sign the APK, add these groups in Codemagic UI → Environment variables:
      #   group: android_keystore
      #     CM_KEYSTORE_PATH, CM_KEY_ALIAS, CM_KEY_PASSWORD, CM_STORE_PASSWORD
      # groups:
      #   - android_keystore

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build release APK
        script: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -1 | tr -d ' ')
          APP_VERSION_NAME=$(echo "$VERSION_LINE" | cut -d':' -f2 | cut -d'+' -f1)
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://sbox.sana.vn \
            --build-name="$APP_VERSION_NAME" \
            --build-number=$PROJECT_BUILD_NUMBER

      # Uncomment the block below once you add android_keystore env group in Codemagic UI
      # - name: Sign APK
      #   script: |
      #     jarsigner -verbose \
      #       -sigalg SHA256withRSA -digestalg SHA-256 \
      #       -keystore "$CM_KEYSTORE_PATH" \
      #       -storepass "$CM_STORE_PASSWORD" \
      #       -keypass "$CM_KEY_PASSWORD" \
      #       build/app/outputs/flutter-apk/app-release.apk \
      #       "$CM_KEY_ALIAS"

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/flutter-apk/app-release.apk.sha1
