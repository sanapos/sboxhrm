# Codemagic: chọn workflow "iOS Release" hoặc "iOS Debug" — KHÔNG dùng "Default Workflow" + Shorebird.
# Nếu bật Shorebird trên UI: xóa biến SHOREBIRD_TOKEN (đang sai định dạng) hoặc tắt Shorebird trong Workflow Editor.

workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 90
    instance_type: mac_mini_m2
    working_directory: flutter_client

    cache:
      cache_paths:
        - ~/.pub-cache
        - ios/Pods

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - appstore_credentials
      vars:
        APP_STORE_APP_ID: "6762365741"
        BUNDLE_ID: "vn.sana.sbox"
        API_BASE_URL: "https://sbox.sana.vn"

    scripts:
      - name: Disable Shorebird (plain Flutter IPA only)
        script: |
          unset SHOREBIRD_TOKEN || true
          rm -rf "$HOME/.shorebird" 2>/dev/null || true
          hash -r 2>/dev/null || true
          echo "Shorebird disabled — using flutter build ipa"

      - name: Fetch signing files and set up code signing
        script: |
          set -e
          echo "=== Preflight: App Store Connect API ==="
          if [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_KEY_IDENTIFIER" ] || [ -z "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "ERROR: Missing APP_STORE_CONNECT_* env vars (group appstore_credentials)."
            exit 1
          fi
          if ! app-store-connect bundle-ids list 2>&1 | head -5; then
            echo ""
            echo "ERROR: App Store Connect API failed."
            exit 1
          fi
          echo "=== Fetch signing files (App Store) ==="
          CERT_KEY=$(mktemp)
          openssl genrsa -out "$CERT_KEY" 2048
          # Apple allows only one active Distribution cert; revoke stale certs before --create
          app-store-connect certificates list --type IOS_DISTRIBUTION --json 2>/dev/null | python3 -c "import json,sys,subprocess; data=json.load(sys.stdin); items=data if isinstance(data,list) else data.get('certificates', data.get('data', [])); [subprocess.run(['app-store-connect','certificates','delete',c.get('id') or c.get('Id')], check=False) for c in items if c.get('id') or c.get('Id')]" || true
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --certificate-key "@file:$CERT_KEY" \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
          rm -f "$CERT_KEY"
          echo "=== Code signing OK ==="

      - name: Get Flutter packages
        script: flutter pub get

      - name: Convert ArcFace ONNX to CoreML (face on iOS)
        script: |
          if [ -f assets/w600k_mbf.onnx ]; then
            python3 -m pip install --quiet --upgrade coremltools onnx
            python3 ios/scripts/convert_facenet_to_coreml.py
            ls -lh ios/Runner/FaceNet.mlpackage || true
          else
            echo "Skip CoreML convert: assets/w600k_mbf.onnx not in repo (use committed FaceNet.mlpackage)."
          fi

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update

      - name: Build IPA
        script: |
          set -e
          rm -f ~/.shorebird/bin/shorebird 2>/dev/null || true
          export PATH=$(echo "$PATH" | tr ':' '\n' | grep -v shorebird | tr '\n' ':')
          # Must run in same step: Codemagic does not persist export across script steps.
          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -1 | tr -d ' ')
          APP_VERSION_NAME=$(echo "$VERSION_LINE" | cut -d':' -f2 | cut -d'+' -f1)
          if [ -z "$APP_VERSION_NAME" ] || [ "$APP_VERSION_NAME" = "1.0.0" ]; then
            echo "ERROR: Invalid marketing version '$APP_VERSION_NAME' (must be > 1.0.0). Check pubspec.yaml."
            exit 1
          fi
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" || echo 0) + 1))
          echo "CFBundleShortVersionString=$APP_VERSION_NAME CFBundleVersion=$BUILD_NUMBER"
          flutter build ipa --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --build-name="$APP_VERSION_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
          ARCHIVE_PLIST=$(find build/ios/archive -path '*/Products/Applications/*.app/Info.plist' 2>/dev/null | head -1)
          if [ -n "$ARCHIVE_PLIST" ]; then
            echo "Verify archive CFBundleShortVersionString:"
            /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$ARCHIVE_PLIST"
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false

  ios-debug:
    name: iOS Debug (Ad Hoc)
    max_build_duration: 90
    instance_type: mac_mini_m2
    working_directory: flutter_client

    cache:
      cache_paths:
        - ~/.pub-cache
        - ios/Pods

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: "vn.sana.sbox"

    scripts:
      - name: Disable Shorebird (plain Flutter IPA only)
        script: |
          unset SHOREBIRD_TOKEN || true
          rm -rf "$HOME/.shorebird" 2>/dev/null || true

      - name: Fetch signing files and set up code signing
        script: |
          CERT_KEY=$(mktemp)
          openssl genrsa -out "$CERT_KEY" 2048
          app-store-connect certificates list --type IOS_DISTRIBUTION --json 2>/dev/null | python3 -c "import json,sys,subprocess; data=json.load(sys.stdin); items=data if isinstance(data,list) else data.get('certificates', data.get('data', [])); [subprocess.run(['app-store-connect','certificates','delete',c.get('id') or c.get('Id')], check=False) for c in items if c.get('id') or c.get('Id')]" || true
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_ADHOC \
            --platform IOS \
            --certificate-key "@file:$CERT_KEY" \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
          rm -f "$CERT_KEY"

      - name: Get Flutter packages
        script: flutter pub get

      - name: Convert ArcFace ONNX to CoreML (face on iOS)
        script: |
          if [ -f assets/w600k_mbf.onnx ]; then
            python3 -m pip install --quiet --upgrade coremltools onnx
            python3 ios/scripts/convert_facenet_to_coreml.py
          fi

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update

      - name: Build IPA
        script: |
          flutter build ipa --debug \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  android-release:
    name: Android Release (AAB)
    max_build_duration: 60
    instance_type: linux_x2
    working_directory: flutter_client

    environment:
      flutter: stable
      java: 17
      groups:
        - android_keystore
        - google_play
      vars:
        PACKAGE_NAME: "sbox.sana.vn"
        GOOGLE_PLAY_TRACK: internal
        API_BASE_URL: "https://sbox.sana.vn"

    scripts:
      - name: Set up Android keystore
        script: |
          set -e
          if [ -z "$CM_KEYSTORE" ]; then
            echo "ERROR: Missing CM_KEYSTORE (group android_keystore)."
            exit 1
          fi
          KEYSTORE_PATH="${CM_KEYSTORE_PATH:-android/app/sana-release.jks}"
          mkdir -p "$(dirname "$KEYSTORE_PATH")"
          echo "$CM_KEYSTORE" | base64 --decode > "$KEYSTORE_PATH"
          echo "Keystore written to $KEYSTORE_PATH"

      - name: Get Flutter packages
        script: flutter pub get

      - name: Build release AAB
        script: |
          set -e
          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -1 | tr -d ' ')
          APP_VERSION_NAME=$(echo "$VERSION_LINE" | cut -d':' -f2 | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$VERSION_LINE" | cut -d'+' -f2)
          if [ -z "$APP_VERSION_NAME" ] || [ -z "$BUILD_NUMBER" ]; then
            echo "ERROR: Invalid pubspec version line: $VERSION_LINE"
            exit 1
          fi
          echo "Building AAB version=$APP_VERSION_NAME build=$BUILD_NUMBER"
          flutter build appbundle --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --build-name="$APP_VERSION_NAME" \
            --build-number="$BUILD_NUMBER"
          AAB="build/app/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB" ]; then
            echo "ERROR: AAB not found at $AAB"
            exit 1
          fi
          OUT="build/app/outputs/bundle/release/SBOX-HRM-${PACKAGE_NAME}-release-v${BUILD_NUMBER}.aab"
          cp "$AAB" "$OUT"
          ls -lh build/app/outputs/bundle/release/*.aab

    artifacts:
      - build/app/outputs/bundle/release/*.aab

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: $GOOGLE_PLAY_TRACK
        submit_as_draft: false
