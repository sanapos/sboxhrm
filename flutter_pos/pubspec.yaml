name: sbox_pos
description: SBOX POS Flutter — Android 6.0 (FVM 3.22), logic thống nhất với flutter_client POS.
publish_to: "none"
version: 1.0.344+22344

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  http_parser: any
  dio: ^5.4.0
  intl: any
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  path_provider: ^2.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1
  pdf: ^3.10.8
  printing: 5.14.3
  barcode: ^2.2.8
  image_picker: ^1.0.7
  permission_handler: ^11.3.1
  sunmi_printer_plus: ^2.1.3
  mobile_scanner: ^3.5.7
  device_info_plus: ^9.1.0
  image: ^4.2.0
  file_picker: ^8.0.0
  excel: ^4.0.3
  share_plus: ^7.2.2
  open_filex: ^4.6.0
  package_info_plus: ^8.0.0
  print_bluetooth_thermal: ^1.0.9
  fl_chart: ^0.68.0
  flutter_html: ^3.0.0-beta.2
  url_launcher: ^6.2.2
  signalr_netcore: ^1.3.7
  video_player: ^2.8.2
  web: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/sbox_pos_logo.png
    - assets/fonts/BeVietnamPro-Regular.ttf
    - assets/fonts/BeVietnamPro-Bold.ttf
    - assets/certs/isrgrootx1.pem
    - assets/certs/isrg-root-yr.pem
    - assets/certs/lets-encrypt-yr2.pem
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/BeVietnamPro-ExtraBold.ttf
          weight: 800
