plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "vn.sana.sbox.sbox_pos"
    compileSdk = 34
    ndkVersion = "26.1.10909125"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "sbox.sana.vn.pos.flutter"
        // Sunmi T1 (A6) = API 23. Lay tu gradle.properties: so hardcode o day bi
        // `flutter build` tu dong viet de thanh flutter.minSdkVersion (>=24).
        minSdk = (project.findProperty('sboxMinSdk') ?: 23) as Integer
        targetSdk = 23
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
            // Keep assets intact on T1 (broken minify/shrink previously dropped fonts/certs).
            minifyEnabled false
            shrinkResources false
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    // Sideload Sunmi A6: targetSdk 23 is intentional; Play lint does not apply.
    lint {
        checkReleaseBuilds false
        disable 'ExpiredTargetSdkVersion'
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation files("libs/DS_Lib-1.0.16.aar")
    implementation "com.alibaba:fastjson:1.1.67.android"
    implementation "org.greenrobot:greendao:3.2.2"
}
